<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Jogo das Cores</title>
<style>
  :root{
    --red:#e74c3c; --yellow:#f4c20d; --green:#27ae60; --blue:#2f80ed;
    --orange:#f2711c; --purple:#9b59b6;
    --bg1:#1e2a4a; --bg2:#0f1626;
    --panel:rgba(255,255,255,.06);
    --panel-border:rgba(255,255,255,.12);
    --text:#eef2ff; --muted:#9fb0d0;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--text);
    min-height:100vh;
    background:radial-gradient(1200px 800px at 50% -10%, #2a3a66 0%, var(--bg1) 45%, var(--bg2) 100%);
    display:flex; flex-direction:column; align-items:center;
    padding:24px 14px 60px;
    -webkit-user-select:none; user-select:none;
  }
  h1{
    margin:6px 0 2px; font-size:30px; letter-spacing:.5px;
    background:linear-gradient(90deg,var(--red),var(--yellow),var(--green),var(--blue));
    -webkit-background-clip:text; background-clip:text; color:transparent;
    font-weight:800;
  }
  .subtitle{margin:0 0 20px; color:var(--muted); font-size:14px; text-align:center; max-width:520px;}
  .layout{
    display:flex; gap:26px; align-items:flex-start; justify-content:center; flex-wrap:wrap;
  }
  .panel{
    background:var(--panel); border:1px solid var(--panel-border);
    border-radius:20px; padding:18px;
    backdrop-filter:blur(6px);
    box-shadow:0 12px 40px rgba(0,0,0,.35);
  }
  .panel h2{margin:0 0 12px; font-size:15px; text-transform:uppercase; letter-spacing:1.5px; color:var(--muted); text-align:center;}

  /* ---------- Objective + controls card ---------- */
  .target-panel{display:flex; flex-direction:column; align-items:stretch; width:240px; gap:14px;}
  .target-panel h2{margin:0;}
  .target-panel .mini-grid{margin:0 auto;}
  .options{display:flex; flex-direction:column; gap:9px;}
  .options button{width:100%;}
  .options .btn-primary{margin-top:0;}
  .target-panel .moves{text-align:center;}

  /* size selector */
  .sizes{display:flex; gap:6px; justify-content:center;}
  .size-btn{flex:1; padding:7px 0; font-size:13px; font-weight:700; color:var(--muted);
    background:rgba(255,255,255,.08); border:1px solid var(--panel-border); box-shadow:none;}
  .size-btn:hover{background:rgba(255,255,255,.16);}
  .size-btn.active{background:linear-gradient(135deg,#7b5cff,#3f8cff); color:#fff; border-color:transparent;}

  .mini-grid{
    display:grid; gap:7px;
    width:160px; height:160px; padding:8px;
    background:rgba(0,0,0,.25); border-radius:14px;
    transition:transform .25s ease, box-shadow .25s ease;
  }
  .mini-grid.pulse{transform:scale(1.06); box-shadow:0 0 0 3px rgba(255,255,255,.25);}
  .mini{border-radius:6px; box-shadow:inset 0 -3px 6px rgba(0,0,0,.25);}
  .mini.empty{background:repeating-linear-gradient(45deg,rgba(255,255,255,.06),rgba(255,255,255,.06) 5px,transparent 5px,transparent 10px); box-shadow:none; border:1px dashed rgba(255,255,255,.18);}
  .mini.red{background:var(--red);} .mini.yellow{background:var(--yellow);}
  .mini.green{background:var(--green);} .mini.blue{background:var(--blue);}
  .mini.orange{background:var(--orange);} .mini.purple{background:var(--purple);}

  /* ---------- Buttons ---------- */
  button{
    font-family:inherit; cursor:pointer; border:none; color:#fff;
    font-weight:700; font-size:14px; padding:10px 16px; border-radius:11px;
    transition:transform .12s ease, filter .12s ease, box-shadow .12s ease;
    box-shadow:0 5px 14px rgba(0,0,0,.3);
  }
  button:active{transform:translateY(1px) scale(.98);}
  .btn-primary{
    margin-top:16px; width:100%;
    background:linear-gradient(135deg,#7b5cff,#3f8cff);
  }
  .btn-primary:hover{filter:brightness(1.08);}
  .btn-ghost{
    background:rgba(255,255,255,.10); border:1px solid var(--panel-border);
  }
  .btn-ghost:hover{background:rgba(255,255,255,.18);}

  /* ---------- Board ---------- */
  .board-panel{display:flex; flex-direction:column; align-items:center;}
  .stage{transform-origin:top center;}
  #board{position:relative;}
  .slot{
    position:absolute; border-radius:14px; background:rgba(255,255,255,.04);
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.05);
    transition:box-shadow .2s ease, background .2s ease;
  }
  .slot.empty{
    background:repeating-linear-gradient(45deg,rgba(255,255,255,.05),rgba(255,255,255,.05) 7px,transparent 7px,transparent 14px);
    box-shadow:inset 0 0 0 2px rgba(255,255,255,.20);
  }
  .tile{
    position:absolute; border-radius:14px;
    transition:transform .16s cubic-bezier(.2,.8,.25,1), box-shadow .16s ease, filter .12s ease;
    box-shadow:0 6px 0 rgba(0,0,0,.22), 0 10px 18px rgba(0,0,0,.28), inset 0 3px 6px rgba(255,255,255,.35);
    touch-action:none; will-change:transform;
  }
  .tile.red{background:linear-gradient(150deg,#ff7d72,var(--red));}
  .tile.yellow{background:linear-gradient(150deg,#ffe371,var(--yellow));}
  .tile.green{background:linear-gradient(150deg,#62e08c,var(--green));}
  .tile.blue{background:linear-gradient(150deg,#73a9ff,var(--blue));}
  .tile.orange{background:linear-gradient(150deg,#ffae6b,var(--orange));}
  .tile.purple{background:linear-gradient(150deg,#c98fe0,var(--purple));}
  .tile.movable{cursor:grab;}
  .tile.movable:hover{filter:brightness(1.07); box-shadow:0 6px 0 rgba(0,0,0,.22), 0 12px 22px rgba(0,0,0,.34), inset 0 3px 6px rgba(255,255,255,.4), 0 0 0 3px rgba(255,255,255,.25);}
  .tile.dragging{cursor:grabbing; transition:none; z-index:10; filter:brightness(1.1);}
  .tile .label{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-size:34px; font-weight:800; color:rgba(255,255,255,.95);
    text-shadow:0 2px 5px rgba(0,0,0,.4); pointer-events:none;
    opacity:0; transition:opacity .2s ease;
  }
  #board.show-letters .tile .label{opacity:1;}

  .btn-ghost.solving{background:linear-gradient(135deg,#ff7d72,var(--red)); border-color:transparent;}
  .moves{color:var(--muted); font-size:15px; white-space:nowrap; font-variant-numeric:tabular-nums;}
  .moves b{color:var(--text); font-size:17px; display:inline-block; min-width:2.6ch; text-align:left; font-variant-numeric:tabular-nums;}

  /* ---------- Win ---------- */
  .win{
    margin-top:22px; font-size:22px; font-weight:800; text-align:center;
    color:#fff; padding:12px 22px; border-radius:14px;
    background:linear-gradient(135deg,var(--green),#1f8f54);
    box-shadow:0 10px 30px rgba(39,174,96,.45);
    animation:pop .4s ease;
  }
  .hidden{display:none;}
  @keyframes pop{0%{transform:scale(.6);opacity:0;}100%{transform:scale(1);opacity:1;}}

  #confetti{position:fixed; inset:0; pointer-events:none; overflow:hidden; z-index:50;}
  .confetti{position:absolute; top:-12px; width:10px; height:14px; border-radius:2px; opacity:.9; animation:fall linear forwards;}
  @keyframes fall{to{transform:translateY(105vh) rotate(540deg);}}

  @media (max-width:560px){
    body{padding:10px 10px 14px;}
    h1{font-size:20px; margin-top:0;}
    .subtitle{font-size:11px; margin-bottom:8px;}
    .layout{gap:12px; flex-direction:column; align-items:center;}
    .panel{padding:10px; border-radius:14px;}

    /* Compact: small objective grid on the left, options stacked on the right */
    .target-panel{
      flex-direction:row; flex-wrap:wrap; width:auto; max-width:100%; gap:8px 12px;
      justify-content:center; align-items:center;
    }
    .target-panel h2{width:100%; margin:0; font-size:11px;}
    .sizes{width:100%;}
    .size-btn{padding:6px 0; font-size:12px;}
    .target-panel .mini-grid{width:88px; height:88px; gap:3px; padding:5px; border-radius:10px; margin:0;}
    .options{flex:1 1 170px; min-width:160px; gap:6px;}

    button{font-size:13px; padding:8px 12px; border-radius:10px; box-shadow:0 4px 10px rgba(0,0,0,.28);}
    .moves{font-size:13px; width:100%; text-align:center;}
    .win{font-size:18px; padding:9px 16px;}
  }
</style>
</head>
<body>
  <h1>Jogo das Cores</h1>
  <p class="subtitle">Deslize as peças até o tabuleiro ficar igual ao objetivo.</p>

  <div class="layout">
    <div class="panel target-panel">
      <h2>Objetivo</h2>
      <div class="sizes" id="sizes">
        <button class="size-btn" data-n="3">Fácil</button>
        <button class="size-btn" data-n="4">Médio</button>
        <button class="size-btn" data-n="5">Difícil</button>
      </div>
      <div id="targetGrid" class="mini-grid"></div>
      <div class="options">
        <button id="drawBtn" class="btn-primary">🎲 Sortear card</button>
        <button id="shuffleBtn" class="btn-ghost">🔀 Embaralhar</button>
        <button id="solveBtn" class="btn-ghost">🤖 Resolver</button>
      </div>
      <span class="moves">Movimentos: <b id="moveCount">0</b></span>
    </div>

    <div class="panel board-panel">
      <div class="stage" id="stage">
        <div id="board"></div>
      </div>
    </div>
  </div>

  <div id="winMsg" class="win hidden">🎉 Você conseguiu!</div>
  <div id="confetti"></div>

<script>
(function(){
  "use strict";

  // ===== Configuration =====
  const PALETTE=["red","yellow","green","blue","orange","purple"];
  let N=3;                       // board dimension (3,4,5)
  function gameColors(){ return PALETTE.slice(0, N+1); }   // N+1 colours, each used N-1 times

  // ===== Responsive geometry =====
  let CELL, GAP, PAD, STRIDE, SIZE;
  const MINCELL=22, MAXCELL=96, BOARD_MAX_DESKTOP=360;
  function isMobile(){ return window.innerWidth <= 560; }
  function setMode(){
    PAD = isMobile() ? 10 : 12;
    GAP = (N>=5 ? (isMobile()?5:7) : N>=4 ? (isMobile()?6:8) : (isMobile()?8:10));
  }
  function cellFromBoard(px){ return Math.floor((px - PAD*2 - GAP*(N-1)) / N); }
  function setCell(cell){
    cell = Math.max(MINCELL, Math.min(MAXCELL, Math.floor(cell)));
    CELL = cell; STRIDE = CELL + GAP; SIZE = PAD*2 + CELL*N + GAP*(N-1);
  }
  function widthAvail(){
    return isMobile() ? (window.innerWidth - 44) : Math.min(window.innerWidth - 80, BOARD_MAX_DESKTOP);
  }

  // ===== DOM =====
  const boardEl  = document.getElementById("board");
  const targetEl = document.getElementById("targetGrid");
  const moveEl   = document.getElementById("moveCount");
  const winEl    = document.getElementById("winMsg");
  const confEl   = document.getElementById("confetti");
  const sizesEl  = document.getElementById("sizes");

  // ===== State =====
  let board = [];        // length N*N: {id,color} or null
  let target = [];       // length N*N: color string or null
  let blank = 0;
  let moves = 0;
  let solved = false;
  const tileEls = new Map();
  let slotEls = [];

  // ===== Grid helpers =====
  function cellXY(i){ const r=(i/N)|0, c=i%N; return {x: PAD + c*STRIDE, y: PAD + r*STRIDE}; }
  function adjacent(a,b){ const ra=(a/N)|0, ca=a%N, rb=(b/N)|0, cb=b%N; return Math.abs(ra-rb)+Math.abs(ca-cb)===1; }
  function gridNbrs(n,i){ const r=(i/n)|0,c=i%n,o=[]; if(r>0)o.push(i-n); if(r<n-1)o.push(i+n); if(c>0)o.push(i-1); if(c<n-1)o.push(i+1); return o; }
  function makeTiles(){
    const t=[];
    gameColors().forEach(c=>{ for(let k=0;k<N-1;k++) t.push({id:c+"-"+k, color:c}); });
    return t; // (N+1)*(N-1) = N*N-1 tiles
  }
  function boardColors(){ return board.map(t => t ? t.color : null); }
  function indexOfTile(id){ return board.findIndex(t => t && t.id===id); }

  // ===== Build / rebuild board DOM =====
  function buildDOM(){
    boardEl.innerHTML=""; tileEls.clear(); slotEls=[];
    const cells=N*N;
    for(let i=0;i<cells;i++){ const s=document.createElement("div"); s.className="slot"; boardEl.appendChild(s); slotEls.push(s); }
    makeTiles().forEach((t,i)=>{
      const el=document.createElement("div");
      el.className="tile "+t.color; el.dataset.id=t.id;
      const lab=document.createElement("span");
      lab.className="label"; lab.textContent=String.fromCharCode(65+i); // A,B,C...
      el.appendChild(lab);
      el.addEventListener("pointerdown", onDown);
      boardEl.appendChild(el);
      tileEls.set(t.id, el);
    });
    targetEl.style.gridTemplateColumns = `repeat(${N},1fr)`;
  }

  function applyLayout(){
    setMode();
    let cell = cellFromBoard(widthAvail());
    if(isMobile()){
      const lp=document.querySelector(".target-panel");
      if(lp){
        const LAYOUT_GAP=12, PANEL_PAD_TOP=10, BOTTOM=10+14+10;
        const topOfBoard = lp.getBoundingClientRect().bottom + LAYOUT_GAP + PANEL_PAD_TOP;
        const availH = window.innerHeight - topOfBoard - BOTTOM;
        cell = Math.min(cell, cellFromBoard(availH));
      }
    }
    setCell(cell);
    boardEl.style.width = SIZE + "px";
    boardEl.style.height = SIZE + "px";
    const rad = Math.max(6, Math.round(CELL*0.16));
    slotEls.forEach((s,i)=>{
      s.style.width=CELL+"px"; s.style.height=CELL+"px"; s.style.borderRadius=rad+"px";
      const {x,y}=cellXY(i); s.style.transform=`translate(${x}px,${y}px)`;
    });
    tileEls.forEach(el=>{
      el.style.width=CELL+"px"; el.style.height=CELL+"px"; el.style.borderRadius=rad+"px";
      const lab=el.firstChild; if(lab) lab.style.fontSize = Math.round(CELL*0.42) + "px";
    });
    renderBoard();
  }

  // ===== Core move =====
  function doMove(idx){
    if(idx===blank || !adjacent(idx, blank)) return false;
    board[blank]=board[idx]; board[idx]=null; blank=idx; return true;
  }

  // ===== Scramble (random legal moves) =====
  function scramble(){
    let prev=-1;
    const steps=N*N*60;
    for(let k=0;k<steps;k++){
      const pool0=gridNbrs(N,blank);
      let pool=pool0.filter(i=>i!==prev);
      if(!pool.length) pool=pool0;
      const pick=pool[(Math.random()*pool.length)|0];
      prev=blank; doMove(pick);
    }
  }

  // ===== Target card =====
  function shuffleArr(a){ for(let i=a.length-1;i>0;i--){ const j=(Math.random()*(i+1))|0; [a[i],a[j]]=[a[j],a[i]]; } }
  function sameAsBoard(arr){ const bc=boardColors(); return arr.every((c,i)=>c===bc[i]); }
  function drawTarget(){
    stopAuto(); hideLetters();
    let arr;
    do { arr=[]; gameColors().forEach(c=>{ for(let k=0;k<N-1;k++) arr.push(c); }); arr.push(null); shuffleArr(arr); }
    while(sameAsBoard(arr));
    target=arr;
    solved=false; moves=0; updateMoves(); hideWin();
    renderTarget(); renderBoard();
    targetEl.classList.add("pulse");
    setTimeout(()=>targetEl.classList.remove("pulse"), 260);
  }

  // ===== Rendering =====
  function renderTarget(){
    targetEl.innerHTML="";
    target.forEach(c=>{ const cell=document.createElement("div"); cell.className="mini "+(c?c:"empty"); targetEl.appendChild(cell); });
  }
  function renderBoard(){
    tileEls.forEach((el,id)=>{
      const idx=indexOfTile(id);
      const {x,y}=cellXY(idx);
      el.style.transform=`translate(${x}px,${y}px)`;
      el.classList.toggle("movable", !solved && adjacent(idx, blank));
    });
    slotEls.forEach((s,i)=> s.classList.toggle("empty", i===blank));
  }
  function updateMoves(){ moveEl.textContent=moves; }

  // ===== Win =====
  function checkWin(){
    if(solved) return;
    const bc=boardColors();
    if(bc.every((c,i)=>c===target[i])){ solved=true; renderBoard(); winEl.classList.remove("hidden"); celebrate(); }
  }
  function hideWin(){ winEl.classList.add("hidden"); }
  function celebrate(){
    const cols=["var(--red)","var(--yellow)","var(--green)","var(--blue)","var(--orange)","var(--purple)","#ffffff"];
    for(let i=0;i<48;i++){
      const c=document.createElement("div"); c.className="confetti";
      c.style.left=(Math.random()*100)+"%"; c.style.background=cols[i%cols.length];
      c.style.animationDuration=(1.6+Math.random()*1.4)+"s"; c.style.animationDelay=(Math.random()*0.4)+"s";
      confEl.appendChild(c); setTimeout(()=>c.remove(), 3400);
    }
  }

  function playerMove(idx){
    if(solved) return;
    if(doMove(idx)){ moves++; updateMoves(); renderBoard(); checkWin(); }
  }

  // ===== Solver: BFS for 3x3, constructive (two-phase) for larger =====
  // -- BFS (optimal) for N=3 --
  function toStr(arr){ return arr.map(c => c ? c[0] : "_").join(""); }
  function bfsSolve(startArr, goalArr){
    const start=toStr(startArr), goal=toStr(goalArr);
    if(start===goal) return [];
    const prev=new Map(); prev.set(start,null); const q=[start]; let h=0;
    function applyStr(s, idx){ const b=s.indexOf("_"); const a=s.split(""); a[b]=a[idx]; a[idx]="_"; return a.join(""); }
    while(h<q.length){
      const s=q[h++]; if(s===goal) break; const b=s.indexOf("_");
      for(const n of gridNbrs(N,b)){ const ns=applyStr(s,n); if(!prev.has(ns)){ prev.set(ns,{from:s,idx:n}); q.push(ns); } }
    }
    if(!prev.has(goal)) return null;
    const path=[]; let cur=goal; while(prev.get(cur)){ const p=prev.get(cur); path.push(p.idx); cur=p.from; }
    return path.reverse();
  }

  // -- Constructive solver (works for any N) --
  function attemptDirect(n, state, tileForCell){
    let bl=state.indexOf(-1);
    const out=[]; const frozen=new Set();
    const id=(r,c)=>r*n+c;
    function slide(cell){ state[bl]=state[cell]; state[cell]=-1; bl=cell; out.push(cell); }
    function solveCells(list){
      list=list.filter(o=>o.tile!==undefined);
      if(!list.length) return true;
      const goals=list.map(o=>o.cell);
      const startPos=list.map(o=>state.indexOf(o.tile));
      const reached=(pos)=>pos.every((p,i)=>p===goals[i]);
      if(reached(startPos)){ goals.forEach(g=>frozen.add(g)); return true; }
      const prev=new Map(); prev.set(startPos.concat([bl]).join(','), null);
      const q=[[startPos, bl]]; let h=0, endKey=null;
      while(h<q.length && endKey===null){
        const [pos, b]=q[h++]; const pk=pos.concat([b]).join(',');
        for(const nb of gridNbrs(n,b)){
          if(frozen.has(nb)) continue;
          const npos=pos.slice(); for(let i=0;i<npos.length;i++) if(npos[i]===nb) npos[i]=b;
          const nk=npos.concat([nb]).join(',');
          if(prev.has(nk)) continue;
          prev.set(nk,{pk, move:nb});
          if(reached(npos)){ endKey=nk; break; }
          q.push([npos, nb]);
        }
      }
      if(endKey===null) return false;
      const seq=[]; let k=endKey; while(prev.get(k)){ const e=prev.get(k); seq.push(e.move); k=e.pk; } seq.reverse();
      for(const cell of seq) slide(cell);
      goals.forEach(g=>frozen.add(g));
      return true;
    }
    function peelLine(cells){
      if(cells.length<=2) return solveCells(cells.map(c=>({tile:tileForCell[c],cell:c})));
      for(let i=0;i<cells.length-2;i++){ if(!solveCells([{tile:tileForCell[cells[i]],cell:cells[i]}])) return false; }
      const a=cells[cells.length-2], b=cells[cells.length-1];
      return solveCells([{tile:tileForCell[a],cell:a},{tile:tileForCell[b],cell:b}]);
    }
    // find the target's blank cell; peel toward the 2x2 that contains it
    let bt=-1; for(let i=0;i<n*n;i++) if(tileForCell[i]===undefined){ bt=i; break; }
    const br=(bt/n)|0, bc=bt%n;
    const fr=(br<=n-2)?br:n-2, fc=(bc<=n-2)?bc:n-2;
    let r0=0,r1=n-1,c0=0,c1=n-1;
    while(r1-r0>1){
      if(r0<fr){ const cells=[]; for(let c=c0;c<=c1;c++) cells.push(id(r0,c)); if(!peelLine(cells)) return null; r0++; }
      else { const cells=[]; for(let c=c0;c<=c1;c++) cells.push(id(r1,c)); if(!peelLine(cells)) return null; r1--; }
    }
    while(c1-c0>1){
      if(c0<fc){ if(!peelLine([id(r0,c0),id(r1,c0)])) return null; c0++; }
      else { if(!peelLine([id(r0,c1),id(r1,c1)])) return null; c1--; }
    }
    const fin=[id(r0,c0),id(r0,c1),id(r1,c0),id(r1,c1)].map(c=>({tile:tileForCell[c],cell:c}));
    if(!solveCells(fin)) return null;
    return out;
  }
  // remove blank "there and back" oscillations (X->Y->X) repeatedly
  function cleanupMoves(startColors, moves){
    let seq=[startColors.indexOf(null)].concat(moves);
    let changed=true;
    while(changed){
      changed=false; const res=[seq[0]];
      for(let i=1;i<seq.length;i++){
        if(res.length>=2 && res[res.length-2]===seq[i]){ res.pop(); changed=true; }
        else res.push(seq[i]);
      }
      seq=res;
    }
    return seq.slice(1);
  }
  function constructiveSolve(startColors, targetColors){
    if(startColors.every((c,i)=>c===targetColors[i])) return [];
    const M=N*N; const state=new Array(M); const tileColor=[]; let tid=0;
    for(let i=0;i<M;i++){ if(startColors[i]===null) state[i]=-1; else { state[i]=tid; tileColor[tid]=startColors[i]; tid++; } }
    const cellsByColor=new Map(), tilesByColor=new Map();
    for(let i=0;i<M;i++){ const c=targetColors[i]; if(c===null) continue; (cellsByColor.get(c)||cellsByColor.set(c,[]).get(c)).push(i); }
    for(let t=0;t<tid;t++){ const c=tileColor[t]; (tilesByColor.get(c)||tilesByColor.set(c,[]).get(c)).push(t); }
    function mapping(swap){
      const m=new Array(M).fill(undefined);
      for(const [c,cells] of cellsByColor){ const tiles=tilesByColor.get(c); for(let k=0;k<cells.length;k++) m[cells[k]]=tiles[k]; }
      if(swap) for(const [c,cells] of cellsByColor){ if(cells.length>=2){ const a=cells[0],b=cells[1]; const t=m[a]; m[a]=m[b]; m[b]=t; break; } }
      return m;
    }
    for(const swap of [false,true]){ const r=attemptDirect(N, state.slice(), mapping(swap)); if(r) return cleanupMoves(startColors, r); }
    return null;
  }
  function computeSolution(){
    const start=boardColors(), goal=target;
    return N===3 ? bfsSolve(start, goal) : constructiveSolve(start, goal);
  }

  // ===== Auto-solve =====
  let autoTimer=null;
  function isAutoSolving(){ return autoTimer!==null; }
  function stopAuto(){
    if(autoTimer){ clearInterval(autoTimer); autoTimer=null; }
    const btn=document.getElementById("solveBtn");
    if(btn){ btn.textContent="🤖 Resolver"; btn.classList.remove("solving"); }
  }
  function startAuto(){
    if(solved) return;
    const path=computeSolution();
    if(!path || !path.length) return;
    const btn=document.getElementById("solveBtn");
    btn.textContent="⏸ Parar"; btn.classList.add("solving");
    const speed = N===3 ? 450 : Math.max(28, Math.min(220, Math.round(6000/path.length)));
    let i=0;
    autoTimer=setInterval(()=>{
      if(i>=path.length || solved){ stopAuto(); return; }
      playerMove(path[i++]);
      if(solved || i>=path.length) stopAuto();
    }, speed);
  }
  function toggleAuto(){ isAutoSolving() ? stopAuto() : startAuto(); }

  // ===== Pointer dragging =====
  let drag=null;
  function onDown(e){
    if(solved || isAutoSolving()) return;
    const el=e.currentTarget; const idx=indexOfTile(el.dataset.id);
    if(!adjacent(idx, blank)) return;
    const ri=(idx/N)|0, ci=idx%N, rb=(blank/N)|0, cb=blank%N;
    const axis=(ri===rb)?"x":"y";
    const dir=axis==="x"?Math.sign(cb-ci):Math.sign(rb-ri);
    drag={el,idx,axis,dir,base:cellXY(idx),sx:e.clientX,sy:e.clientY,off:0,moved:0};
    el.classList.add("dragging");
    try{ el.setPointerCapture(e.pointerId); }catch(_){}
    window.addEventListener("pointermove", onMove);
    window.addEventListener("pointerup", onUp);
    window.addEventListener("pointercancel", onUp);
    e.preventDefault();
  }
  function onMove(e){
    if(!drag) return;
    const dx=e.clientX-drag.sx, dy=e.clientY-drag.sy;
    drag.moved=Math.max(drag.moved, Math.abs(dx)+Math.abs(dy));
    const raw=drag.axis==="x"?dx*drag.dir:dy*drag.dir;
    drag.off=Math.max(0, Math.min(STRIDE, raw));
    const x=drag.base.x + (drag.axis==="x"?drag.dir*drag.off:0);
    const y=drag.base.y + (drag.axis==="y"?drag.dir*drag.off:0);
    drag.el.style.transform=`translate(${x}px,${y}px)`;
  }
  function onUp(e){
    if(!drag) return;
    const d=drag; drag=null;
    window.removeEventListener("pointermove", onMove);
    window.removeEventListener("pointerup", onUp);
    window.removeEventListener("pointercancel", onUp);
    d.el.classList.remove("dragging");
    try{ d.el.releasePointerCapture(e.pointerId); }catch(_){}
    const isTap=d.moved<6;
    if(isTap || d.off > STRIDE*0.45) playerMove(d.idx);
    else renderBoard();
  }

  // ===== Keyboard =====
  function onKey(e){
    if(solved || isAutoSolving()) return;
    const rb=(blank/N)|0, cb=blank%N; let idx=-1;
    if(e.key==="ArrowUp"    && rb<N-1) idx=blank+N;
    else if(e.key==="ArrowDown"  && rb>0)   idx=blank-N;
    else if(e.key==="ArrowLeft"  && cb<N-1) idx=blank+1;
    else if(e.key==="ArrowRight" && cb>0)   idx=blank-1;
    if(idx>=0){ playerMove(idx); e.preventDefault(); }
  }

  // ===== Buttons =====
  document.getElementById("drawBtn").addEventListener("click", drawTarget);
  document.getElementById("shuffleBtn").addEventListener("click", ()=>{
    stopAuto(); hideLetters(); scramble();
    if(target.length && sameAsBoard(target)) scramble();
    solved=false; moves=0; updateMoves(); hideWin(); renderBoard();
  });
  document.getElementById("solveBtn").addEventListener("click", ()=>{ hideLetters(); toggleAuto(); });

  // size selector
  function updateSizeButtons(){ sizesEl.querySelectorAll(".size-btn").forEach(b=>b.classList.toggle("active", +b.dataset.n===N)); }
  sizesEl.addEventListener("click", (e)=>{
    const b=e.target.closest(".size-btn"); if(!b) return;
    const n=+b.dataset.n; if(n===N) return;
    newGame(n);
  });

  // Easter egg: click the objective card 5x to reveal letters
  let cardClicks=0;
  function hideLetters(){ boardEl.classList.remove("show-letters"); cardClicks=0; }
  targetEl.addEventListener("click", ()=>{
    if(boardEl.classList.contains("show-letters")) return;
    if(++cardClicks>=5){ boardEl.classList.add("show-letters"); cardClicks=0; }
  });

  window.addEventListener("keydown", onKey);
  let resizeTimer=null;
  window.addEventListener("resize", ()=>{ clearTimeout(resizeTimer); resizeTimer=setTimeout(applyLayout, 80); });

  // ===== New game / init =====
  function newGame(n){
    N=n;
    stopAuto();
    buildDOM();
    board=makeTiles(); board.push(null); blank=N*N-1;
    scramble();
    drawTarget();
    if(sameAsBoard(target)) scramble();
    updateSizeButtons();
    applyLayout();
  }
  newGame(3);
})();
</script>
</body>
